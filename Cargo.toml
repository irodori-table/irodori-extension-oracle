[package]
name = "irodori-extension-oracle"
version = "0.1.8"
publish = false
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for Oracle."
repository = "https://github.com/irodori-table/irodori-extension-oracle"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
  "native/source/**",
  "vendor/**",
]

[lib]
name = "irodori_extension_oracle"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/irodori-table/irodori-kit", tag = "v0.9.6" }
oracle-rs = "0.1.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
# oracle-rs 0.1.7 with the fixes listed in vendor/oracle-rs-0.1.7-patched/PATCHES.md.
oracle-rs = { path = "vendor/oracle-rs-0.1.7-patched" }
